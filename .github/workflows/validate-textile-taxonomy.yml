name: Validate textile taxonomy

on:
  push:
    paths:
      - "produto/textile-protocol/**"
      - ".github/workflows/validate-textile-taxonomy.yml"
  pull_request:
    paths:
      - "produto/textile-protocol/**"
      - ".github/workflows/validate-textile-taxonomy.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: produto/textile-protocol/executavel-v0.4.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python validate.py --all
