services:
  - type: web
    name: phyllos-textile-recognition-lab
    runtime: python
    plan: free
    region: ohio
    rootDir: produto/textile-protocol/guided-capture-shadow-v0.1.1
    buildCommand: pip install -r requirements.txt
    startCommand: python src/cli.py serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
